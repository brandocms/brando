name: CI
on:
  push:
  pull_request:
  # Lets the E2E job be run on demand without raising a PR — it is skipped on
  # push because it is slow, so this is the only other way to exercise it.
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mix_test:
    name: mix test (OTP ${{matrix.otp}} | Elixir ${{matrix.elixir}})

    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: 1.17.2
            otp: 27.0
          - elixir: 1.18.1
            otp: 27.2
          - elixir: 1.19.5
            otp: 28.0
          - elixir: 1.20.3
            otp: 28.4.1

    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brando_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and _build cache
        uses: actions/cache@v5.0.5
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Install dependencies
        run: mix deps.get --only test

      - name: Remove compiled application files
        run: mix clean

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Reset db
        run: mix ecto.reset

      - name: Run Tests
        run: mix test --warnings-as-errors

  quality:
    name: Blueprint quality gates
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1

      - name: Restore deps and _build cache
        uses: actions/cache@v5.0.5
        with:
          path: |
            deps
            _build
          key: quality-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            quality-${{ runner.os }}-28.4.1-1.20.3

      - name: Install dependencies
        run: mix deps.get --only test

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Run strict Blueprint code analysis
        run: mix credo --strict lib/brando/blueprint.ex lib/brando/blueprint

      # Back to zero. The 251-module cycle this gate used to tolerate was not
      # the Blueprint DSL after all — it was a handful of accidental
      # compile-time calls, the last of which was a single struct literal in a
      # form `default`. See brandocms/brando#2737 for the list; the pattern to
      # watch for is a compile-time call (module attribute, `%Struct{}` literal,
      # macro-expansion-time function call) that crosses from a leaf into a
      # module the callee's own dependencies reach back to.
      - name: Reject compile-connected dependency cycles
        run: mix xref graph --format cycles --label compile-connected --fail-above 0

  docs:
    name: Published documentation
    runs-on: ubuntu-latest
    env:
      MIX_ENV: docs

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1

      - name: Restore docs dependencies and build cache
        uses: actions/cache@v5.0.5
        with:
          path: |
            deps
            _build
          key: docs-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            docs-${{ runner.os }}-28.4.1-1.20.3

      - name: Install documentation dependencies
        run: mix deps.get --only docs

      - name: Build published documentation without warnings
        run: mix docs --warnings-as-errors

  e2e:
    name: E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: legacy-1
            shard: 1/2
          - suite: legacy-2
            shard: 2/2
          - suite: authorization
            shard: ''
    env:
      # Each CI job has its own PostgreSQL service, so a stable key keeps the
      # generated database and port predictable while exercising the same
      # worktree-aware path used locally.
      BRANDO_E2E_INSTANCE: ci
      BRANDO_E2E_POOL_SIZE: 50
    # Each shard gets its own runner, PostgreSQL service, server, PubSub and
    # caches. Keep workers: 1 within a server; only isolated jobs run in parallel.
    # Authorization runs independently so it need not wait for the legacy suite.
    # PRs only, avoiding duplicate E2E runs for push + pull_request events.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Non-blocking until it has a track record. This job was added on
    # 2026-07-18 and had never once run to completion — it died at the first
    # step, checking out a then-private repo — so its CI pass rate is entirely
    # unknown. Runners are slower and more variable than a dev machine, which
    # is where LiveView timing races tend to surface, and `retries: 2` on CI
    # will hide some of what does. Let it report for a while, then decide from
    # the record whether to make it blocking, move it to a nightly schedule, or
    # drop it.
    continue-on-error: true

    services:
      db:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_project_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out Brando
        uses: actions/checkout@v6.0.3
        with:
          path: brando

      - name: Reject machine-specific E2E paths
        working-directory: brando
        run: bash .github/scripts/check-e2e-paths.sh

      - name: Check out JSON API integration
        uses: actions/checkout@v6.0.3
        with:
          repository: brandocms/brando_json_api
          path: brando_json_api

      - name: Check out GraphQL integration
        uses: actions/checkout@v6.0.3
        with:
          repository: brandocms/brando_graphql
          path: brando_graphql

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `@brandocms/europacss` pins postcss-functions to an SSH remote
      # (git@github.com:twined/postcss-functions.git) in its own published
      # dependencies, so it cannot be changed from this repo. The runner has no
      # SSH key and the clone exits 128. The repo is public, so rewriting to
      # HTTPS fetches it anonymously; git rewrites at clone time, leaving the
      # lockfile and --frozen-lockfile intact.
      - name: Fetch GitHub git dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install Elixir dependencies
        working-directory: brando/e2e
        run: source .envrc && MIX_ENV=e2e mix deps.get

      - name: Install Brando asset dependencies
        working-directory: brando/assets
        run: pnpm install --frozen-lockfile

      - name: Build backend assets through the E2E consumer
        working-directory: brando/e2e/assets/backend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build frontend assets
        working-directory: brando/e2e/assets/frontend
        run: |
          corepack enable
          yarn install --frozen-lockfile
          yarn build

      - name: Install Playwright
        working-directory: brando/e2e/e2e/playwright
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run legacy E2E shard
        if: matrix.shard != ''
        working-directory: brando/e2e
        run: source .envrc && ./test_e2e.sh --reset --shard=${{ matrix.shard }}

      - name: Run group authorization, preview and collaboration regressions
        if: matrix.suite == 'authorization'
        working-directory: brando/e2e
        run: |
          source .envrc
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/groups \
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/groups/results.json \
          BRANDO_AUTHORIZATION_MODE=groups ./test_e2e.sh --reset --output=test-results/groups \
            tests/users/groups.spec.js tests/blocks/block-live-preview.spec.js \
            tests/blocks/block-multiuser-sync.spec.js tests/projects/file-field-sync.spec.js \
            tests/projects/multi-select-reorder.spec.js

      - name: Run multi-site authorization regressions
        if: matrix.suite == 'authorization'
        working-directory: brando/e2e
        run: |
          source .envrc
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/multi \
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/multi/results.json \
          BRANDO_AUTHORIZATION_MODE=groups BRANDO_TENANCY_MODE=multi \
            ./test_e2e.sh --output=test-results/multi tests/users/authorization-sites.spec.js

      - name: Run single-site authorization regressions
        if: matrix.suite == 'authorization'
        working-directory: brando/e2e
        run: |
          source .envrc
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/single \
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/single/results.json \
          BRANDO_AUTHORIZATION_MODE=groups BRANDO_TENANCY_MODE=single \
            ./test_e2e.sh --output=test-results/single tests/users/authorization-sites.spec.js

      - name: Upload E2E reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.suite }}
          path: |
            brando/e2e/e2e/playwright/playwright-report
            brando/e2e/e2e/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7
