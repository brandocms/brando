name: CI
on:
  # Only main: a branch with a PR is covered by `pull_request`, which tests the
  # merge result. Building it on `push` as well ran everything twice.
  push:
    branches: [main]
  pull_request:
  # Merge queue readiness: a queue on `main` runs this workflow on its
  # temporary merge commit (refs/heads/gh-readonly-queue/main/…) and waits for
  # the required checks there. Those are the jobs below that run on every
  # event: mix test (all three), E2E app unit tests, Admin CSS colour tokens,
  # Blueprint quality gates and Published documentation. They read no pull_request context, so
  # they behave the same on the queued commit. The E2E jobs stay PR-only
  # (informational, and the PR already ran them); igniter-smoke.yml has no
  # merge_group trigger because its path filter cannot apply to a queue run.
  #
  # A queue run reuses the PR's run when that run already passed on the same
  # tree, usually a PR queued alone onto an unchanged main: the `reuse` job
  # finds it, and those jobs keep reporting under their own names but skip
  # every step. Skipping the jobs themselves would not do: a skipped matrix job
  # reports once as `mix test (OTP ${{matrix.otp}} | …)`, never under the three
  # required names. A PR run records what it tested in the `record` job; see
  # .github/scripts/merge-queue-reuse.sh. A reused run trusts what lies
  # outside the tree as it was at PR time (e2e_unit's brando_json_api and
  # brando_graphql checkouts, action tags); the push to main after the merge
  # reruns everything.
  merge_group:
    types: [checks_requested]
  # Lets the E2E job be run on demand without raising a PR — it is skipped on
  # push because it is slow, so this is the only other way to exercise it.
  # `coverage` is ticked by the weekly coverage.yml run; it can also be ticked
  # by hand.
  workflow_dispatch:
    inputs:
      coverage:
        description: Measure test coverage (unit + E2E) and publish a merged report
        type: boolean
        default: false
permissions:
  contents: read

concurrency:
  # A coverage run gets its own group so a push to main does not cancel it.
  # A merge queue run is keyed on its own commit and never cancelled: a
  # cancelled or replaced queue run fails the entry and drops the PR from the
  # queue. A newer push still cancels the older run on a PR branch.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'merge_group' && github.sha || github.ref }}${{ inputs.coverage && '-coverage' || '' }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Merge queue only. Its `reused` output is 'true' when a pull_request run of
  # this workflow passed on the queued commit's tree and base; the jobs that
  # need it then skip their steps. They run with `!cancelled()`, so they still
  # run in full when this job is skipped (any other event) or fails, and the
  # lookup step may fail without failing the job. `record` must need every job
  # that reads the output.
  reuse:
    name: Reuse a passed pull request run (merge queue)
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      reused: ${{ steps.lookup.outputs.reused }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Look for a passed pull_request run of this tree
        id: lookup
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: .github/scripts/merge-queue-reuse.sh lookup "$GITHUB_SHA" "$BASE_REF" | tee -a "$GITHUB_STEP_SUMMARY"

  mix_test:
    name: mix test (OTP ${{matrix.otp}} | Elixir ${{matrix.elixir}})
    needs: reuse
    if: ${{ !cancelled() }}

    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: 1.18.1
            otp: 27.2
          - elixir: 1.19.5
            otp: 28.0
          - elixir: 1.20.3
            otp: 28.4.1

    runs-on: ubuntu-latest

    services:
      db:
        # An empty image starts no service: a reused merge queue run needs none.
        image: ${{ needs.reuse.outputs.reused != 'true' && 'public.ecr.aws/docker/library/postgres:14' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: brando_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.reuse.outputs.reused != 'true'

      - name: Set up Elixir
        if: needs.reuse.outputs.reused != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore deps and _build cache
        if: github.event_name != 'merge_group'
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}-
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      # A merge queue run restores the cache but does not save one: its
      # temporary branch could never reuse it, and the entries would evict
      # main's from the 10 GB cache.
      - name: Restore deps and _build cache (merge queue, restore only)
        if: github.event_name == 'merge_group' && needs.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}-
            deps-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}

      - name: Install dependencies
        if: needs.reuse.outputs.reused != 'true'
        run: mix deps.get --only test

      - name: Compile without warnings
        if: needs.reuse.outputs.reused != 'true'
        # Incremental builds replay stored warnings, including unchanged files.
        run: mix compile --all-warnings --warnings-as-errors

      - name: Reset db
        if: needs.reuse.outputs.reused != 'true'
        run: mix ecto.reset

      - name: Run Tests
        if: needs.reuse.outputs.reused != 'true'
        run: mix test --warnings-as-errors ${{ inputs.coverage && matrix.elixir == '1.20.3' && '--cover --export-coverage unit' || '' }}

      - name: Upload unit coverage data
        if: inputs.coverage && matrix.elixir == '1.20.3'
        uses: actions/upload-artifact@v4
        with:
          name: coverdata-unit
          path: cover/unit.coverdata
          retention-days: 7

  css_colors:
    name: Admin CSS colour tokens
    needs: reuse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.reuse.outputs.reused != 'true'

      - name: Reject new hex colours outside the tokens file
        if: needs.reuse.outputs.reused != 'true'
        run: bash .github/scripts/check_css_colors.sh

  quality:
    name: Blueprint quality gates
    needs: reuse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.reuse.outputs.reused != 'true'

      - name: Set up Elixir
        if: needs.reuse.outputs.reused != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1

      - name: Restore deps and _build cache
        if: github.event_name != 'merge_group'
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: quality-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            quality-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-
            quality-${{ runner.os }}-28.4.1-1.20.3

      # A merge queue run restores the cache but does not save one: its
      # temporary branch could never reuse it, and the entries would evict
      # main's from the 10 GB cache.
      - name: Restore deps and _build cache (merge queue, restore only)
        if: github.event_name == 'merge_group' && needs.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            deps
            _build
          key: quality-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            quality-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-
            quality-${{ runner.os }}-28.4.1-1.20.3

      - name: Install dependencies
        if: needs.reuse.outputs.reused != 'true'
        run: mix deps.get --only test

      - name: Check formatting
        if: needs.reuse.outputs.reused != 'true'
        run: mix format --check-formatted

      - name: Compile without warnings
        if: needs.reuse.outputs.reused != 'true'
        run: mix compile --warnings-as-errors

      - name: Check usage-rules.md matches the guides
        if: needs.reuse.outputs.reused != 'true'
        run: mix brando.docs.agents --check

      - name: Run strict Blueprint code analysis
        if: needs.reuse.outputs.reused != 'true'
        run: mix credo --strict lib/brando/blueprint.ex lib/brando/blueprint

      # Brando's own checks (credo/checks). Globs, not directories: Credo
      # finds no files for a bare `test` argument. scripts/check runs the same.
      - name: Check that tests put back the caches they change and keep the sandbox unshared
        if: needs.reuse.outputs.reused != 'true'
        run: mix credo --strict --checks Brando.Credo.Check.TestCacheRestore,Brando.Credo.Check.TestSandboxShared "test/**/*.{ex,exs}" "e2e/test/**/*.{ex,exs}"

      # Back to zero. The 251-module cycle this gate used to tolerate was not
      # the Blueprint DSL after all — it was a handful of accidental
      # compile-time calls, the last of which was a single struct literal in a
      # form `default`. See brandocms/brando#2737 for the list; the pattern to
      # watch for is a compile-time call (module attribute, `%Struct{}` literal,
      # macro-expansion-time function call) that crosses from a leaf into a
      # module the callee's own dependencies reach back to.
      - name: Reject compile-connected dependency cycles
        if: needs.reuse.outputs.reused != 'true'
        run: mix xref graph --format cycles --label compile-connected --fail-above 0

      # `--check-up-to-date` only compares the POT files, so extract and merge
      # for real and require a clean tree: every string in the code is in the
      # POT and PO files, and no message whose call was removed is left over.
      # The Norwegian translations themselves are checked by
      # test/brando/gettext_test.exs. See TRANSLATIONS.md.
      - name: Reject out-of-date Gettext catalogues
        if: needs.reuse.outputs.reused != 'true'
        run: |
          mix gettext.extract --merge > /dev/null
          if [ -n "$(git status --porcelain --untracked-files=all -- priv/gettext)" ]; then
            git status --short -- priv/gettext
            git diff -- priv/gettext
            echo "::error::The Gettext catalogues are out of date. Run mix gettext.extract --merge, translate the new Norwegian entries and commit priv/gettext."
            exit 1
          fi

      - name: Check the Gettext merge driver
        if: needs.reuse.outputs.reused != 'true'
        run: python3 scripts/gettext-merge-driver --self-test

      - name: Check how ci-wait tells known flakes from real failures
        if: needs.reuse.outputs.reused != 'true'
        run: bash test/scripts/ci_wait_test.sh

      - name: Check when a merge queue run reuses a pull request run
        if: needs.reuse.outputs.reused != 'true'
        run: bash test/scripts/merge_queue_reuse_test.sh

      - name: Validate the changelog fragments
        if: needs.reuse.outputs.reused != 'true'
        run: scripts/changelog check

      - name: Check how changelog fragments are validated and collated
        if: needs.reuse.outputs.reused != 'true'
        run: bash test/scripts/changelog_test.sh

      - name: Check scripts/queue and when scripts/check skips its Elixir gates
        if: needs.reuse.outputs.reused != 'true'
        run: |
          bash test/scripts/queue_test.sh
          bash test/scripts/check_test.sh

      - name: Check that the shell tests leave the repository alone under a Git hook
        if: needs.reuse.outputs.reused != 'true'
        run: bash test/scripts/hook_env_test.sh

  docs:
    name: Published documentation
    needs: reuse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: docs

    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.reuse.outputs.reused != 'true'

      - name: Set up Elixir
        if: needs.reuse.outputs.reused != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1

      - name: Restore docs dependencies and build cache
        if: github.event_name != 'merge_group'
        uses: actions/cache@v6.1.0
        with:
          path: |
            deps
            _build
          key: docs-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            docs-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-
            docs-${{ runner.os }}-28.4.1-1.20.3

      # A merge queue run restores the cache but does not save one: its
      # temporary branch could never reuse it, and the entries would evict
      # main's from the 10 GB cache.
      - name: Restore docs dependencies and build cache (merge queue, restore only)
        if: github.event_name == 'merge_group' && needs.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            deps
            _build
          key: docs-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            docs-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-
            docs-${{ runner.os }}-28.4.1-1.20.3

      - name: Install documentation dependencies
        if: needs.reuse.outputs.reused != 'true'
        run: mix deps.get --only docs

      - name: Build published documentation without warnings
        if: needs.reuse.outputs.reused != 'true'
        run: mix docs --warnings-as-errors

  # The E2E app's own ExUnit tests (e2e/test/unit): Brando against a real
  # application's lib/, router, assets and migrations, without a browser. They
  # compile in MIX_ENV=test, which the E2E jobs' e2e build cannot reuse, and
  # run on every event, unlike those jobs.
  e2e_unit:
    name: E2E app unit tests
    needs: reuse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
      BRANDO_E2E_INSTANCE: ci

    services:
      db:
        # An empty image starts no service: a reused merge queue run needs none.
        image: ${{ needs.reuse.outputs.reused != 'true' && 'public.ecr.aws/docker/library/postgres:14' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_project_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7.0.1
        if: needs.reuse.outputs.reused != 'true'
        with:
          path: brando
      - uses: actions/checkout@v7.0.1
        if: needs.reuse.outputs.reused != 'true'
        with:
          repository: brandocms/brando_json_api
          path: brando_json_api
      - uses: actions/checkout@v7.0.1
        if: needs.reuse.outputs.reused != 'true'
        with:
          repository: brandocms/brando_graphql
          path: brando_graphql

      - name: Set up Elixir
        if: needs.reuse.outputs.reused != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1

      - name: Restore E2E unit-test dependencies and build
        if: github.event_name != 'merge_group'
        uses: actions/cache@v6.1.0
        with:
          path: |
            brando/e2e/deps
            brando/e2e/_build
          key: e2e-unit-v1-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('brando/e2e/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            e2e-unit-v1-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('brando/e2e/mix.lock') }}-
            e2e-unit-v1-${{ runner.os }}-28.4.1-1.20.3-

      # As in mix_test: a merge queue run restores the cache but saves none.
      - name: Restore E2E unit-test dependencies and build (merge queue, restore only)
        if: github.event_name == 'merge_group' && needs.reuse.outputs.reused != 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            brando/e2e/deps
            brando/e2e/_build
          key: e2e-unit-v1-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('brando/e2e/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            e2e-unit-v1-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('brando/e2e/mix.lock') }}-
            e2e-unit-v1-${{ runner.os }}-28.4.1-1.20.3-

      - name: Install Elixir dependencies
        if: needs.reuse.outputs.reused != 'true'
        working-directory: brando/e2e
        run: source .envrc && mix deps.get

      # Creates, migrates and seeds the database, then runs mix test.
      - name: Run the E2E app's unit tests
        if: needs.reuse.outputs.reused != 'true'
        working-directory: brando/e2e
        run: ./test_unit.sh

  # Pull requests only, once every job the merge queue can reuse has passed:
  # uploads an artifact named after the tree this run tested and its base,
  # which `reuse` looks up. The script matches this job by name. Not required,
  # and a failure here only means the queue runs everything. The `if` checks
  # each need's result itself: the implicit success() also fails on `reuse`,
  # which those jobs need and which is skipped on a pull request.
  record:
    name: Record the tested tree for the merge queue
    needs: [mix_test, css_colors, quality, docs, e2e_unit]
    if: >-
      ${{ !cancelled() && github.event_name == 'pull_request'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && !contains(needs.*.result, 'skipped') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Name the record after the tested tree and base
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(.github/scripts/merge-queue-reuse.sh name "$GITHUB_SHA")"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "run $GITHUB_RUN_ID tested $GITHUB_SHA" > merge-queue-record.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.record.outputs.name }}
          path: merge-queue-record.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  e2e_build:
    name: Compile E2E dependencies and application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Preserve the informational status of the existing E2E jobs.
    continue-on-error: true
    # Main builds seed a cache that future PRs can restore. PR-only caches are
    # scoped to that PR and cannot warm the next branch's first run. Not run
    # for merge_group: only the E2E jobs need it, and they are PR-only.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      BRANDO_E2E_INSTANCE: ci
      BRANDO_E2E_POOL_SIZE: 50
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: brando
      - uses: actions/checkout@v7.0.1
        with:
          repository: brandocms/brando_json_api
          path: brando_json_api
      - uses: actions/checkout@v7.0.1
        with:
          repository: brandocms/brando_graphql
          path: brando_graphql
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1
      - name: Restore E2E dependencies and build
        uses: actions/cache@v6.1.0
        with:
          path: |
            brando/e2e/deps
            brando/e2e/_build
          key: e2e-v1-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('brando/e2e/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            e2e-v1-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('brando/e2e/mix.lock') }}-
            e2e-v1-${{ runner.os }}-28.4.1-1.20.3-
      - name: Install Elixir dependencies
        working-directory: brando/e2e
        run: source .envrc && MIX_ENV=e2e mix deps.get
      - name: Compile without warnings
        working-directory: brando/e2e
        run: source .envrc && MIX_ENV=e2e mix compile --all-warnings --warnings-as-errors

  e2e:
    name: E2E (${{ matrix.suite }})
    needs: e2e_build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four legacy shards: with two, the slower one ran about 18 minutes
          # of tests and set the PR's wall-clock time. Playwright splits by
          # test count with whole files kept together, so the shards are not
          # even; on the 7 October timings the longest of four is about 10
          # minutes of tests.
          - suite: legacy-1
            shard: 1/4
          - suite: legacy-2
            shard: 2/4
          - suite: legacy-3
            shard: 3/4
          - suite: legacy-4
            shard: 4/4
          - suite: authorization
            shard: ''
    env:
      # Each CI job has its own PostgreSQL service, so a stable key keeps the
      # generated database and port predictable while exercising the same
      # worktree-aware path used locally.
      BRANDO_E2E_INSTANCE: ci
      BRANDO_E2E_POOL_SIZE: 50
      # Coverage runs only: each server Playwright starts exports its data to
      # BRANDO_E2E_COVER_EXPORT on shutdown. Every step that starts a server
      # names its own file so a later server does not overwrite an earlier one.
      BRANDO_E2E_COVER: ${{ inputs.coverage && '1' || '' }}
    # Each shard gets its own runner, PostgreSQL service, server, PubSub and
    # caches. Keep workers: 1 within a server; only isolated jobs run in parallel.
    # Authorization runs independently so it need not wait for the legacy suite.
    # PRs only, avoiding duplicate E2E runs for push + pull_request events,
    # and not in the merge queue: it is informational and would add half an
    # hour to every queued PR.
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    # Non-blocking until it has a track record. This job was added on
    # 2026-07-18 and had never once run to completion — it died at the first
    # step, checking out a then-private repo — so its CI pass rate is entirely
    # unknown. Runners are slower and more variable than a dev machine, which
    # is where LiveView timing races tend to surface, and `retries: 2` on CI
    # will hide some of what does. Let it report for a while, then decide from
    # the record whether to make it blocking, move it to a nightly schedule, or
    # drop it.
    continue-on-error: true

    services:
      db:
        image: public.ecr.aws/docker/library/postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: e2e_project_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out Brando
        uses: actions/checkout@v7.0.1
        with:
          path: brando

      - name: Reject machine-specific E2E paths
        working-directory: brando
        run: bash .github/scripts/check-e2e-paths.sh

      - name: Check out JSON API integration
        uses: actions/checkout@v7.0.1
        with:
          repository: brandocms/brando_json_api
          path: brando_json_api

      - name: Check out GraphQL integration
        uses: actions/checkout@v7.0.1
        with:
          repository: brandocms/brando_graphql
          path: brando_graphql

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `@brandocms/europacss` pins postcss-functions to an SSH remote
      # (git@github.com:twined/postcss-functions.git) in its own published
      # dependencies, so it cannot be changed from this repo. The runner has no
      # SSH key and the clone exits 128. The repo is public, so rewriting to
      # HTTPS fetches it anonymously; git rewrites at clone time, leaving the
      # lockfile and --frozen-lockfile intact.
      - name: Fetch GitHub git dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Restore E2E dependencies and build
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            brando/e2e/deps
            brando/e2e/_build
          key: e2e-v1-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('brando/e2e/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            e2e-v1-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('brando/e2e/mix.lock') }}-
            e2e-v1-${{ runner.os }}-28.4.1-1.20.3-

      - name: Install Elixir dependencies
        working-directory: brando/e2e
        run: source .envrc && MIX_ENV=e2e mix deps.get

      - name: Compile E2E application
        working-directory: brando/e2e
        run: source .envrc && MIX_ENV=e2e mix compile --all-warnings --warnings-as-errors

      - name: Install Brando asset dependencies
        working-directory: brando/assets
        run: pnpm install --frozen-lockfile

      - name: Build backend assets through the E2E consumer
        working-directory: brando/e2e/assets/backend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build frontend assets
        working-directory: brando/e2e/assets/frontend
        # Only the yarn shim: a bare `corepack enable` also replaces the pnpm
        # pinned above with whatever pnpm is newest that day.
        run: |
          corepack enable yarn
          yarn install --frozen-lockfile
          yarn build

      - name: Install Playwright
        working-directory: brando/e2e/playwright
        timeout-minutes: 5
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install chromium

      # `install-deps` is `apt-get update && apt-get install` against the Ubuntu
      # mirrors. On 7 October 2026 a mirror stopped answering mid-update and
      # five shards sat in this step until the 30-minute job limit, each
      # costing a full rerun. apt now gives up on a silent mirror after 30 s
      # and retries, and each attempt is capped at 3 minutes (a normal run
      # takes 10-20 s; a slow mirror about 3). The runner image already has
      # Chromium's libraries; this step adds fonts and newer Mesa. If both
      # attempts fail the job carries on, and Playwright names any library
      # that is missing when it launches the browser.
      - name: Install Chromium's system packages
        working-directory: brando/e2e/playwright
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-brando-ci-timeouts > /dev/null
          for attempt in 1 2; do
            # As root, Playwright runs apt itself rather than through sudo,
            # so `timeout` can stop the whole apt process group.
            if sudo env "PATH=$PATH" timeout --kill-after=15s 3m pnpm exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::Installing Chromium's system packages failed (attempt $attempt of 2)"
            sudo timeout 1m dpkg --configure -a || true
          done
          echo "::warning::Continuing with the runner image's packages"

      - name: Run fast rich-text and block input regressions
        if: matrix.suite == 'legacy-1'
        working-directory: brando/e2e
        run: |
          source .envrc
          node --test ../test/javascript/*.test.mjs
          cd playwright
          pnpm exec playwright test --config tiptap.config.js

      - name: Run legacy E2E shard
        if: matrix.shard != ''
        working-directory: brando/e2e
        env:
          BRANDO_E2E_COVER_EXPORT: ${{ github.workspace }}/brando/cover/e2e-${{ matrix.suite }}.coverdata
        run: |
          source .envrc
          if [ '${{ matrix.suite }}' = 'legacy-1' ]; then
            ./test_e2e.sh --check-migrations --shard=${{ matrix.shard }}
          else
            ./test_e2e.sh --reset --shard=${{ matrix.shard }}
          fi

      - name: Run group authorization, preview and collaboration regressions
        if: matrix.suite == 'authorization'
        working-directory: brando/e2e
        env:
          BRANDO_E2E_COVER_EXPORT: ${{ github.workspace }}/brando/cover/e2e-authorization-groups.coverdata
        run: |
          source .envrc
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/groups \
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/groups/results.json \
          BRANDO_AUTHORIZATION_MODE=groups ./test_e2e.sh --reset --output=test-results/groups \
            tests/users/groups.spec.js tests/config/authorization-tools.spec.js \
            tests/blocks/block-live-preview.spec.js \
            tests/blocks/block-multiuser-sync.spec.js tests/projects/file-field-sync.spec.js \
            tests/projects/multi-select-reorder.spec.js

      - name: Run multi-site authorization regressions
        if: matrix.suite == 'authorization'
        working-directory: brando/e2e
        env:
          BRANDO_E2E_COVER_EXPORT: ${{ github.workspace }}/brando/cover/e2e-authorization-multi.coverdata
        run: |
          source .envrc
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/multi \
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/multi/results.json \
          BRANDO_AUTHORIZATION_MODE=groups BRANDO_TENANCY_MODE=multi \
            ./test_e2e.sh --output=test-results/multi tests/users/authorization-sites.spec.js

      - name: Run single-site authorization regressions
        if: matrix.suite == 'authorization'
        working-directory: brando/e2e
        env:
          BRANDO_E2E_COVER_EXPORT: ${{ github.workspace }}/brando/cover/e2e-authorization-single.coverdata
        run: |
          source .envrc
          PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report/single \
          PLAYWRIGHT_JSON_OUTPUT_FILE=test-results/single/results.json \
          BRANDO_AUTHORIZATION_MODE=groups BRANDO_TENANCY_MODE=single \
            ./test_e2e.sh --output=test-results/single tests/users/authorization-sites.spec.js

      - name: Upload E2E reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ matrix.suite }}
          path: |
            brando/e2e/playwright/playwright-report
            brando/e2e/playwright/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload E2E coverage data
        if: always() && inputs.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverdata-e2e-${{ matrix.suite }}
          path: brando/cover/*.coverdata
          if-no-files-found: warn
          retention-days: 7

  # Merges the unit and E2E exports into one report. Runs even when E2E
  # failed (it is still informational), using whatever data was exported.
  coverage_report:
    name: Coverage report
    needs: [mix_test, e2e]
    if: always() && inputs.coverage
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.3
          otp-version: 28.4.1

      - name: Restore deps and _build cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            deps
            _build
          key: deps-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-${{ github.sha }}
          restore-keys: |
            deps-${{ runner.os }}-28.4.1-1.20.3-${{ hashFiles('**/mix.lock') }}-
            deps-${{ runner.os }}-28.4.1-1.20.3

      - name: Install dependencies
        run: mix deps.get --only test

      - name: Compile
        run: mix compile

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverdata-*
          path: cover
          merge-multiple: true

      # `mix test.coverage` cover-compiles this job's own build and imports
      # every cover/*.coverdata into it, so the jobs' differing checkout paths
      # do not matter.
      - name: Merge coverage
        run: |
          ls -la cover
          mix test.coverage | tee coverage.txt
          {
            echo '## Test coverage (unit + E2E)'
            echo
            echo "Merged from: $(cd cover && ls *.coverdata | tr '\n' ' ')"
            echo
            grep -E '\| Total' coverage.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Convert to lcov
        run: mix run --no-start .github/scripts/coverage_lcov.exs

      # Feeds the README badge and the trend on codecov.io. Needs the
      # CODECOV_TOKEN repository secret.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cover/lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            cover/*.html
            cover/lcov.info
            coverage.txt
          retention-days: 30
