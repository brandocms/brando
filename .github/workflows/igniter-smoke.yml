name: Igniter consumer smoke

# No merge_group trigger, so do not make these checks required: merge_group
# has no path filter, so a queue run would start all six consumers for
# every queued PR, and a required check from a path-filtered workflow never
# reports on PRs outside the paths, which then cannot merge.
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'priv/templates/**'
      - 'usage-rules/**'
      - 'scripts/igniter_smoke/**'
      - 'scripts/igniter_smoke.sh'
      - 'scripts/release-version'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/igniter-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: igniter-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Consumer (${{ matrix.tenancy }}, ${{ matrix.bootstrap }}, ${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # checkout: Brando from this checkout, BrandoJS through Yalc.
        # packaged: the Hex and npm packages a release candidate of this
        # commit would publish, installed without the checkout or Yalc.
        include:
          - tenancy: none
            bootstrap: fresh
            source: checkout
          - tenancy: single
            bootstrap: fresh
            source: checkout
          - tenancy: multi
            bootstrap: fresh
            source: checkout
          - tenancy: none
            bootstrap: precompiled
            source: checkout
          - tenancy: none
            bootstrap: fresh
            source: packaged
          - tenancy: multi
            bootstrap: fresh
            source: packaged
    env:
      BRANDO_SMOKE_PGPORT: '5432'
      BRANDO_SMOKE_PGPASSWORD: postgres
      BRANDO_SMOKE_BOOTSTRAP: ${{ matrix.bootstrap }}
      BRANDO_SMOKE_SOURCE: ${{ matrix.source }}
    steps:
      # The runner's own PostgreSQL (16 on ubuntu-latest). A service
      # container pulled its image on every job, and the registry's pull
      # limits failed jobs before a test ran.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          timeout 60 sh -c 'until pg_isready -h localhost -q; do sleep 1; done'
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: 1.20.4
          otp-version: 28.5.0.8
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.15.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the qualified Phoenix generator
        run: mix archive.install hex phx_new 1.8.13 --force
      # A packaged install must not need Yalc, so its job has none.
      - name: Install Yalc
        if: matrix.source == 'checkout'
        run: npm install --global yalc@1.0.0-pre.53
      - name: Install browser test dependencies
        timeout-minutes: 5
        run: |
          pnpm --dir scripts/igniter_smoke install --frozen-lockfile
          pnpm --dir scripts/igniter_smoke exec playwright install chromium
      # As in ci.yml's E2E jobs: `install-deps` is `apt-get update && apt-get
      # install` against the Ubuntu mirrors. On 22 October 2026 one consumer
      # job got a 403 from packages.microsoft.com and others sat on a silent
      # Azure mirror until the 40-minute job limit, each costing a full rerun.
      # apt gives up on a silent mirror after 30 s and retries, each attempt is
      # capped at 3 minutes, and if both fail the job carries on with the
      # runner image's packages: Playwright names any library that is missing
      # when it launches the browser.
      - name: Install Chromium's system packages
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' |
            sudo tee /etc/apt/apt.conf.d/80-brando-ci-timeouts > /dev/null
          for attempt in 1 2; do
            if sudo env "PATH=$PATH" timeout --kill-after=15s 3m pnpm --dir scripts/igniter_smoke exec playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::Installing Chromium's system packages failed (attempt $attempt of 2)"
            sudo timeout 1m dpkg --configure -a || true
          done
          echo "::warning::Continuing with the runner image's packages"
      - name: Install and exercise a fresh consumer
        id: smoke
        run: ./scripts/igniter_smoke.sh "${{ matrix.tenancy }}"
      - name: Preserve smoke logs and browser failures
        if: always() && steps.smoke.outputs.root != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: igniter-${{ matrix.tenancy }}-${{ matrix.bootstrap }}-${{ matrix.source }}
          path: |
            ${{ steps.smoke.outputs.root }}/logs
            ${{ steps.smoke.outputs.root }}/browser-*
          retention-days: 7
