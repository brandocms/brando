name: Igniter consumer smoke

# No merge_group trigger, so do not make these checks required: merge_group
# has no path filter, so a queue run would start all six consumers for
# every queued PR, and a required check from a path-filtered workflow never
# reports on PRs outside the paths, which then cannot merge.
on:
  pull_request:
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'priv/templates/**'
      - 'usage-rules/**'
      - 'scripts/igniter_smoke/**'
      - 'scripts/igniter_smoke.sh'
      - 'scripts/release-version'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/igniter-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: igniter-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: Consumer (${{ matrix.tenancy }}, ${{ matrix.bootstrap }}, ${{ matrix.source }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # checkout: Brando from this checkout, BrandoJS through Yalc.
        # packaged: the Hex and npm packages a release candidate of this
        # commit would publish, installed without the checkout or Yalc.
        include:
          - tenancy: none
            bootstrap: fresh
            source: checkout
          - tenancy: single
            bootstrap: fresh
            source: checkout
          - tenancy: multi
            bootstrap: fresh
            source: checkout
          - tenancy: none
            bootstrap: precompiled
            source: checkout
          - tenancy: none
            bootstrap: fresh
            source: packaged
          - tenancy: multi
            bootstrap: fresh
            source: packaged
    env:
      BRANDO_SMOKE_PGPORT: '5432'
      BRANDO_SMOKE_PGPASSWORD: postgres
      BRANDO_SMOKE_BOOTSTRAP: ${{ matrix.bootstrap }}
      BRANDO_SMOKE_SOURCE: ${{ matrix.source }}
    steps:
      # The runner's own PostgreSQL (16 on ubuntu-latest). A service
      # container pulled its image on every job, and the registry's pull
      # limits failed jobs before a test ran.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          timeout 60 sh -c 'until pg_isready -h localhost -q; do sleep 1; done'
          sudo -u postgres psql -q -c "ALTER USER postgres PASSWORD 'postgres'"

      - uses: actions/checkout@v7.0.1
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: 1.20.4
          otp-version: 28.5.0.8
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install the qualified Phoenix generator
        run: mix archive.install hex phx_new 1.8.13 --force
      # A packaged install must not need Yalc, so its job has none.
      - name: Install Yalc
        if: matrix.source == 'checkout'
        run: npm install --global yalc@1.0.0-pre.53
      - name: Install browser test dependencies
        run: |
          pnpm --dir scripts/igniter_smoke install --frozen-lockfile
          pnpm --dir scripts/igniter_smoke exec playwright install --with-deps chromium
      - name: Install and exercise a fresh consumer
        id: smoke
        run: ./scripts/igniter_smoke.sh "${{ matrix.tenancy }}"
      - name: Preserve smoke logs and browser failures
        if: always() && steps.smoke.outputs.root != ''
        uses: actions/upload-artifact@v7
        with:
          name: igniter-${{ matrix.tenancy }}-${{ matrix.bootstrap }}-${{ matrix.source }}
          path: |
            ${{ steps.smoke.outputs.root }}/logs
            ${{ steps.smoke.outputs.root }}/browser-*
          retention-days: 7
