:root{--ink:#292e2c;--muted:#6f7771;--line:#e2e5de;--paper:#fff;--wash:#f5f6f2;--green:#254e3f;--sage:#e9efe5;--amber:#96672b;--font:Main,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#eeefea;font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}button,input,textarea{font:inherit}button{cursor:pointer}button,a{-webkit-tap-highlight-color:transparent}button{color:inherit}button:disabled{cursor:default;opacity:.55}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #53785b;outline-offset:4px}button{border:0;background:none}h1,h2,h3,p{margin:0}a{color:inherit}img{display:block;max-width:100%}svg.icon{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.small{font-size:12px;color:var(--muted)}.eyebrow{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}.muted{color:var(--muted)}.spacer{flex:1}.row{display:flex;align-items:center;gap:8px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:3px 7px;font-size:11px;line-height:1.4;white-space:nowrap}.pill.green{color:#356045;background:#edf3e9}.pill.amber{color:#80591f;background:#f7f0e3}.pill.gray{color:#69736d;background:#f1f3ef}.dot{display:inline-block;width:5px;height:5px;background:currentColor;border-radius:50%;flex-shrink:0}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:8px 13px;background:white;font-size:13px;white-space:nowrap;transition:background .15s,transform .15s}.button:hover{background:#f3f5ef}.button.primary{background:var(--green);border-color:var(--green);color:white}.button.primary:hover{background:#1a3f31}.button .icon{width:15px;height:15px}.button.text{background:transparent;border-color:transparent}.icon-button{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px}.icon-button:hover{background:#edf0e9}.icon-button .icon{width:16px;height:16px}

function composer(id='chat-input'){return `<form class="chat-form"><div class="composer"><textarea id="${id}" aria-label="Refine the proposal" placeholder="Ask for an adjustment…" rows="2"></textarea><div class="composer-actions"><button type="button" class="icon-button" data-action="assets" aria-label="Browse attached assets">${icon('plus')}</button><button type="button" class="icon-button" data-action="assets" aria-label="Attach media">${icon('clip')}</button><span class="small" style="font-size:10px">7 assets attached</span><button type="submit" class="send-button" aria-label="Send adjustment">${icon('up')}</button></div></div><div class="composer-hint">Changes are only applied after your confirmation.</div></form>`;}
function conversation(){return `<aside class="conversation ${state.mobileChat?'mobile-open':''}" aria-label="Conversation"><div><div class="session-heading"><h2>Sommerro content</h2><button class="icon-button" data-action="history" style="margin-left:auto" aria-label="Conversation details">${icon('dots')}</button></div><div class="session-date">TODAY · 10:42</div></div><div><div class="message-author"><span class="avatar">TH</span>You</div><div class="user-message">Add a case block to <strong>Identity</strong> using <span class="mention">image1</span>, and to <strong>Naming</strong> using <span class="mention">video2</span>.<br><br>Create a case called <strong>Sommerro</strong> with <span class="mention">image2</span> as its cover.</div></div>${miniAssets()}<div class="assistant-message"><div class="assistant-label">${icon('sparkle')}Assistant</div><p>I’ve prepared three changes. The category blocks go after each introduction, and Sommerro starts as a draft.</p><ul class="activity"><li>${icon('check')}Found both category pages</li><li>${icon('check')}Matched your images and video</li><li>${icon('check')}Checked the Case block’s fields</li></ul><div class="chat-status">Everything is ready to review.<br>Your pages haven’t changed yet.</div>${state.notes.map(n=>`<div class="conversation-extra">${escapeHTML(n)}</div>`).join('')}</div><div class="chat-space"></div>${composer()}</aside>`;}
function mediaCover(c){return `<button class="media-cover" data-asset="${c.asset.alias}" aria-label="Preview ${c.asset.alias}"><img src="${c.asset.src}" alt="${c.asset.meta}"><span class="media-badge">${icon(c.asset.type==='video'?'video':'image')}${c.asset.alias}${c.asset.type==='video'?' · 00:24':''}</span>${c.asset.type==='video'?`<span class="play-button"><span class="play-circle">${icon('play')}</span></span>`:''}</button>`;}
function diffRows(c){return `<div class="difference-list">${c.fields.map(([a,b])=>`<div><span>${a}</span><span>${b}</span></div>`).join('')}</div>`;}
function changeCard(c){return `<article class="change-card"><div class="card-top"><div class="card-meta"><span class="eyebrow">${c.kind}</span>${pill(c.action,c.action==='Create'?'green':'gray')}</div><h3 class="card-title">${c.title}${icon('external')}</h3><div class="card-path">${c.path}</div></div>${mediaCover(c)}<div class="card-description"><h3>${c.heading}</h3><p>${c.description}</p><div class="placement"><span class="block-line">${c.before}</span>${icon('arrow')}<span class="block-line added">${c.added}</span></div>${state.details?diffRows(c):''}</div><div class="card-bottom">${icon(c.action==='Create'?'lock':'globe')}${c.publication}<button data-change="${c.id}">Review${icon('chevron')}</button></div></article>`;}
function publicationNote(){return `<div class="publication-note">${icon('shield')}<p><strong>Two live pages will change.</strong> Sommerro will be saved as a draft. Nothing is removed, and your four unused assets stay in the library.</p></div>`;}
function applyBar(guided=false){return `<footer class="apply-bar"><div class="apply-info">${state.applied?'Demo changes applied':'1 new entry · 2 updated entries'}<div class="small">${state.applied?'The original demo can be restored with New conversation.':'2 new blocks · no deletions'}</div></div>${guided?`<span class="small">${state.reviewed.size} of 3 changes reviewed</span>`:''}${button('Adjust proposal','adjust','','text')}${button(state.applied?'View receipt':`Apply 3 changes ${icon('arrow')}`,state.applied?'receipt':'confirm',guided&&state.reviewed.size<3?'disabled title="Review each change first"':'','primary')}</footer>`;}
function workspace(){return `<button class="mobile-chat-toggle" data-action="toggle-chat" aria-expanded="${state.mobileChat}">${icon('chat')}Sommerro conversation<span>${state.mobileChat?'Hide conversation':'Show conversation'} ${state.mobileChat?'−':'+'}</span></button><div class="workspace-body">${conversation()}<section class="review-workspace" aria-label="Proposal review"><div class="review-heading"><div><div class="eyebrow">Proposal 01 · Sommerro</div><h1>Ready for your review</h1><p>A new case and two category pages, ready to check.</p></div><div class="ready-indicator">${icon('check')}All changes checked</div></div><div class="summary-counts"><span><b>1</b> new entry</span><span><b>2</b> updates</span><span><b>0</b> deletions</span></div><div class="section-label"><h2>Changes by entry</h2><button data-action="toggle-details">${state.details?'Hide field details':'Show field details'}</button></div><div class="change-cards">${changes.map(changeCard).join('')}</div>${publicationNote()}<div class="review-space"></div>${applyBar()}</section></div>`;}
function boardCard(c,i){return `<article class="board-column"><div class="board-destination"><span class="destination-number">0${i+1}</span><h2>${c.title}</h2>${pill(c.action,c.action==='Create'?'green':'gray')}</div><div class="board-change">${mediaCover(c)}<div class="board-change-body"><div class="board-change-title"><h3>${c.action==='Create'?'A new case for Sommerro':'A Case block for '+c.title.toLowerCase()}</h3>${icon('external')}</div><p>${c.action==='Create'?'Cover image and name, ready as a draft.':'Added after the page’s introduction.'}</p><div class="asset-connection">${icon(c.asset.type==='video'?'video':'image')}<span>${c.asset.alias}</span>${icon('arrow')}<span>${c.action==='Create'?'Case cover':'Case block / media'}</span></div><div class="board-mini-page">${c.action==='Create'?'<div class="page-strip">Name · Sommerro</div><div class="page-strip insert"><span>＋ New case entry</span><span>Draft</span></div>':`<div class="page-strip">Introduction</div>${!state.before?'<div class="page-strip insert"><span>＋ Case block</span><span>New</span></div>':''}<div class="page-strip">Existing case blocks</div>`}</div></div></div><div class="board-caption"><span>${c.publication} · ${i===2?'Not published':'1 block added'}</span><button data-change="${c.id}">Review fields${icon('chevron')}</button></div></article>`;}
function board(){return `<section class="board-body" aria-label="Visual proposal board"><div class="board-heading"><div><div class="eyebrow">Sommerro · content proposal</div><h1>See where everything goes.</h1><p>Your assets, connected to the entries they’ll become part of.</p></div><div class="board-session">${icon('check')}3 changes ready to review</div></div><div class="board-brief"><span class="brief-label">The brief</span><p>Place image1 on Identity, video2 on Naming, and create Sommerro with image2.</p><button data-action="adjust">${icon('edit')}Refine</button></div><div class="board-assets"><span class="eyebrow">Your assets</span>${assets.map(a=>`<button class="board-asset ${a.used?'selected':''}" data-asset="${a.alias}" aria-label="Preview ${a.alias}"><img src="${a.src}" alt=""><span>${a.alias}</span></button>`).join('')}<span class="small">3 used / 7 attached</span></div><div class="board-cards">${changes.map(boardCard).join('')}</div><div class="board-footer"><div class="board-chat"><div class="board-chat-head">${icon('sparkle')}Want to move something or change an image?</div>${composer('board-input')}</div><div class="board-footer-summary"><strong>1 new case · 2 category updates</strong><p>2 live pages updated · Sommerro saved as a draft</p><button class="asset-tray-link" style="margin-left:auto" data-action="toggle-before">${icon('split')}${state.before?'Show proposed placement':'Compare current placement'}</button></div></div>${applyBar()}</section>`;}
function sitePreview(c){return `<div class="guide-site"><div class="site-mini-nav"><b>STUDIO.</b><span>Work &nbsp; About &nbsp; Contact</span></div><div class="site-mini-head"><p>${c.action==='Create'?'Sommerro':c.title==='Identity'?'Identities with<br>something to say.':'Names that<br>mean something.'}</p><span>${c.action==='Create'?'A place to come together.':'Selected projects and perspectives.'}</span></div>${!state.before?`<div class="site-insertion"><div class="insertion-label">${icon('plus')}${c.action==='Create'?'New case cover':'New Case block · after introduction'}</div><img src="${c.asset.src}" alt="${c.asset.meta}"><strong>${c.action==='Create'?'Sommerro':'Sommerro — '+(c.title==='Identity'?'a new identity':'a name with a story')}</strong><p>${c.action==='Create'?'Draft case':'Case block · '+c.asset.alias}</p></div>`:`<div style="padding:55px 20px;text-align:center;color:#a9a391;font-size:12px">${c.action==='Create'?'This entry does not exist yet.':'No Case block in this position.'}</div>`}<div class="site-existing"><div>${c.action==='Create'?'Case details':'Existing project'}</div><div>${c.action==='Create'?'Related work':'Existing project'}</div></div></div>`;}
function guideDetail(){const c=changes[state.active];return `<article class="guide-detail"><div class="guide-detail-heading"><div><h2>${c.title}</h2><div class="small">${c.path} · ${c.kind}</div></div>${pill(c.action==='Create'?'New draft':'Updates live page',c.action==='Create'?'green':'amber')}</div><div class="guide-detail-body"><div class="guide-preview"><div class="preview-label"><span>Placement preview</span><div class="segmented" aria-label="Compare current and proposed content"><button data-action="before" class="${state.before?'active':''}" aria-pressed="${state.before}">Before</button><button data-action="after" class="${!state.before?'active':''}" aria-pressed="${!state.before}">After</button></div></div>${sitePreview(c)}<p class="preview-disclaimer">Illustrative layout · your site’s template supplies the final design.</p></div><div class="guide-facts"><div><h3>${c.heading}</h3><dl>${c.fields.filter(([k])=>k!=='Media'&&k!=='Cover image').map(([k,v])=>`<div class="fact-row"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl></div><div><h3>${c.action==='Create'?'Cover image':'Selected media'}</h3><button class="chosen-asset" data-asset="${c.asset.alias}" style="width:100%;text-align:left"><img src="${c.asset.src}" alt=""><div><strong>${c.asset.alias}</strong><span>${c.asset.name}</span></div></button></div><div class="guide-effect">${icon('shield')}<p><strong>${c.action==='Create'?'Saved as a draft.':'Visible on your live site.'}</strong><br>${c.action==='Create'?'You can publish the case when it’s ready.':'Existing content stays in place. This block is added after the introduction.'}</p></div></div></div><div class="guide-next"><span>Change ${state.active+1} of 3${state.reviewed.has(state.active)?' · reviewed':''}</span>${button((state.active<2?'Looks good · next':'Looks good · finish review')+icon('arrow'),'next','','primary')}</div></article>`;}
function guided(){return `<section class="guided-body" aria-label="Guided proposal review"><div class="guided-header"><div class="guided-title"><h1>Review each change</h1><p>Check each destination before applying your changes.</p></div><div class="stepper" aria-label="Workflow progress"><button class="step done" data-action="assets"><b>✓</b>Assets</button><span class="step-line"></span><button class="step done" data-action="brief"><b>✓</b>Instructions</button><span class="step-line"></span><span class="step active" aria-current="step"><b>3</b>Review & apply</span></div></div><div class="guided-layout"><aside class="review-list" aria-label="Changes to review"><div class="review-list-heading"><span>Your changes</span><span>${state.reviewed.size} / 3 reviewed</span></div>${changes.map((c,i)=>`<button class="review-list-item ${state.active===i?'selected':''}" data-review="${i}" aria-pressed="${state.active===i}"><img src="${c.asset.src}" alt=""><div><strong>${c.title}</strong><small>${c.action==='Create'?'Create draft case':'Insert Case block'}</small></div>${icon(state.reviewed.has(i)?'check':'chevron')}</button>`).join('')}<div class="guided-prompt"><div class="eyebrow">Your instructions</div>“Use image1 for Identity, video2 for Naming. Create Sommerro with image2.”<button data-action="brief">${icon('edit')}Adjust instructions</button></div></aside>${guideDetail()}</div>${applyBar(true)}</section>`;}
function render(){document.getElementById('app').innerHTML=conceptBar()+`<div class="shell">${navRail()}<main class="main">${header()}${state.concept==='workspace'?workspace():state.concept==='board'?board():guided()}</main></div>`;document.title=`Brando Assistant — ${state.concept==='workspace'?'Workspace':state.concept==='board'?'Visual board':'Guided review'}`;}
function toast(text){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');toastTimer=setTimeout(()=>el.classList.remove('visible'),4200);}
function showDialog(html,confirm=false){const d=document.getElementById(confirm?'confirm-dialog':'detail-dialog');d.innerHTML=html;if(!d.open)d.showModal();}
const dialogHeader=(title)=>`<div class="dialog-header"><h2 id="detail-title">${title}</h2><button class="icon-button" data-action="close" aria-label="Close dialog">${icon('close')}</button></div>`;
function showAsset(alias){const a=assets.find(a=>a.alias===alias);if(!a)return;showDialog(`${dialogHeader(a.alias)}<div class="dialog-body"><img class="dialog-media" src="${a.src}" alt="${a.meta}"><p><strong>${a.name}</strong><br>${a.used?'Used in this proposal.':'Available in the library; not used in this proposal.'}</p><div class="prototype-note">${a.type==='video'?'Video poster for this concept. Playback is not connected.':'Illustrative concept asset; not actual Sommerro project media.'}</div></div><div class="dialog-footer">${button('Done','close')}</div>`);}
function showAssets(){showDialog(`${dialogHeader('Your seven assets')}<div class="dialog-body"><div class="asset-dialog-grid">${assets.map(a=>`<button data-asset="${a.alias}"><img src="${a.src}" alt="${a.meta}"><strong>${a.alias}</strong><small>${a.used?'Used in proposal':'Available'}${a.type==='video'?' · video':''}</small></button>`).join('')}</div><p>Assets keep their labels throughout the conversation. Unused assets stay in your library.</p></div><div class="dialog-footer">${button('Back to proposal','close','','primary')}</div>`);}
function showChange(id){const c=changes.find(c=>c.id===id);showDialog(`${dialogHeader(c.title+' · proposed change')}<div class="dialog-body"><img class="dialog-media" src="${c.asset.src}" alt="${c.asset.meta}"><h3>${c.heading}</h3>${diffRows(c)}<p>${c.effect}</p><div class="prototype-note">Proposal 01 · content has not changed</div></div><div class="dialog-footer">${button('Adjust proposal','adjust')}${button('Back to review','close','','primary')}</div>`);}
function confirm(){showDialog(`<div class="dialog-header"><h2 id="confirm-title">Apply these three changes?</h2><button class="icon-button" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-body"><p class="confirm-copy" style="margin-top:0"><strong>Identity and Naming are live pages.</strong> Their new blocks will be visible after this proposal is applied. Sommerro will be saved as a draft.</p><div class="confirm-list">${changes.map(c=>`<div class="confirm-row"><img src="${c.asset.src}" alt=""><div>${c.title}<div class="small">${c.heading}</div></div>${pill(c.action==='Create'?'New draft':'Live update',c.action==='Create'?'green':'amber')}</div>`).join('')}</div><div class="publication-note" style="margin:0">${icon('shield')}<p>Only the changes you reviewed will be applied. If anything has changed since this preview, you’ll review it again.</p></div><p class="prototype-note">This is a mockup. The button below simulates completion and cannot change Brando content.</p></div><div class="dialog-footer">${button('Keep reviewing','close')}${button('Apply demo changes '+icon('arrow'),'apply','','primary')}</div>`,true);}
function receipt(){showDialog(`<div class="dialog-body success-body"><div class="success-ring">${icon('check')}</div><h2 id="detail-title">Changes applied.</h2><p>Your three changes are complete. Here’s where to find them.</p><div class="success-receipt">${changes.map(c=>`<div>${icon('check')}${c.title}<span>${c.action==='Create'?'Draft created':'Case block added'}</span></div>`).join('')}</div><p class="prototype-note">Demo receipt · no content was changed</p></div><div class="dialog-footer">${button('Back to workspace','close','','primary')}</div>`);}
function adjust(){document.querySelectorAll('dialog[open]').forEach(d=>d.close());if(state.concept==='guided'){brief();return;}if(state.concept==='workspace'&&!state.mobileChat){state.mobileChat=true;render();}const input=document.querySelector('.chat-form textarea');input?.focus();input?.scrollIntoView({behavior:'smooth',block:'center'});}
function brief(){showDialog(`${dialogHeader('Refine your instructions')}<div class="dialog-body"><p style="margin-top:0;margin-bottom:18px">Describe what you’d like to change. In the product, an adjustment creates a new proposal for you to review.</p>${composer('brief-input')}</div><div class="dialog-footer">${button('Back to review','close')}</div>`);}
document.addEventListener('click',event=>{
  const target=event.target.closest('button');if(!target)return;
  if(target.dataset.concept){state.concept=target.dataset.concept;state.before=false;history.replaceState(null,'','#'+state.concept);render();window.scrollTo(0,0);return;}
  if(target.dataset.asset){showAsset(target.dataset.asset);return;}
  if(target.dataset.change){showChange(target.dataset.change);return;}
  if(target.dataset.review!==undefined){state.active=Number(target.dataset.review);state.before=false;render();return;}
  switch(target.dataset.action){
    case 'close':target.closest('dialog')?.close();break;
    case 'toggle-details':state.details=!state.details;render();break;
    case 'toggle-chat':state.mobileChat=!state.mobileChat;render();break;
    case 'toggle-before':state.before=!state.before;render();break;
    case 'before':state.before=true;render();break;
    case 'after':state.before=false;render();break;
    case 'assets':showAssets();break;
    case 'confirm':confirm();break;
    case 'apply':document.getElementById('confirm-dialog').close();state.applied=true;render();receipt();break;
    case 'receipt':receipt();break;
    case 'adjust':adjust();break;
    case 'brief':brief();break;
    case 'next':state.reviewed.add(state.active);state.before=false;if(state.active<2){state.active++;render();}else{render();toast('All three changes reviewed. You can now apply the proposal.');}break;
    case 'new':state={...state,notes:[],applied:false,reviewed:new Set(),active:0,before:false};render();toast('Demo conversation reset.');break;
    case 'history':showDialog(`${dialogHeader('Sommerro content')}<div class="dialog-body"><p style="margin-top:0">Today · 10:42<br>7 attached assets · 3 proposed changes</p><h3>Proposal 01</h3><p>${state.applied?'Demo completed.':'Prepared and ready to review.'} This conversation belongs to Studio website / Production / English.</p></div><div class="dialog-footer">${button('Back to proposal','close','','primary')}</div>`);break;
    case 'nav':toast(target.dataset.label==='Assistant'?'You’re in the Assistant concept.':`${target.dataset.label} is outside this interface mockup.`);break;
    case 'about':showDialog(`${dialogHeader('Three ways to work')}<div class="dialog-body"><h3>A · Workspace</h3><p>Keep the conversation and all proposed changes side by side. Best for tasks across several entries.</p><h3>B · Visual board</h3><p>Give the media and its destinations the most space. Best for arranging a collection of assets.</p><h3>C · Guided review</h3><p>Check one destination at a time. Best for occasional editors and careful review.</p><p class="prototype-note">All content and actions are illustrative. This prototype has no connection to Brando, an LLM or an MCP server.</p></div><div class="dialog-footer">${button('Explore the concepts','close','','primary')}</div>`);break;
  }
});
document.addEventListener('submit',event=>{if(!event.target.matches('.chat-form'))return;event.preventDefault();const input=event.target.querySelector('textarea');const value=input.value.trim();if(!value)return;state.notes.push(value);input.value='';state.reviewed.clear();document.querySelectorAll('dialog[open]').forEach(d=>d.close());render();toast('Adjustment captured in this mockup. The live agent will prepare a revised proposal.');});
document.addEventListener('keydown',event=>{if(event.target.matches('.chat-form textarea')&&event.key==='Enter'&&!event.shiftKey){event.preventDefault();event.target.form.requestSubmit();}});
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
window.addEventListener('hashchange',()=>{const value=location.hash.slice(1);if(concepts.includes(value)){state.concept=value;render();}});
render();
</script>
  </body>
</html>
