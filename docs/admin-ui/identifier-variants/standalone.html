:root { color-scheme: light; --ink: #272b2a; --muted: #626b66; --line: #dce2dc; --accent: #254e3f; }
* { box-sizing: border-box; }
body { margin: 0; background: #f7f8f6; color: var(--ink); font: 14px/1.5 Main, sans-serif; }
main { max-width: 1672px; margin: auto; padding: 32px; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid #345568; outline-offset: 3px; }
button:disabled { cursor: default; opacity: .45; }
.study-heading { display: flex; justify-content: space-between; gap: 24px; align-items: start; }
.eyebrow { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
h1 { font-size: 30px; line-height: 38px; font-weight: 500; letter-spacing: -.6px; }
.study-heading p { margin-top: 8px; color: var(--muted); }
.study-label { border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font-size: 12px; white-space: nowrap; }
.study-controls { display: flex; gap: 4px; padding: 6px; background: #fff; border: 1px solid var(--line); border-radius: 8px; margin: 24px 0 32px; }
.study-controls button { border: 0; border-radius: 5px; padding: 7px 12px; background: transparent; color: var(--muted); font-size: 13px; }
.study-controls button[aria-pressed=true] { background: #edf2ed; color: var(--accent); }
.study-controls .reset { margin-left: auto; }
.comparison { display: grid; grid-template-columns: repeat(2, minmax(0, 620px)); gap: 32px; align-items: start; justify-content: center; }
.comparison[data-view]:not([data-view=all]) { grid-template-columns: minmax(0, 620px); justify-content: center; }
.variant[hidden] { display: none; }
.variant-heading { min-height: 90px; }
.variant-heading h2 { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 500; line-height: 26px; }
.variant-heading .letter { display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid var(--line); border-radius: 6px; background: white; font-size: 13px; }
.variant-heading p { color: var(--muted); font-size: 13px; margin-top: 8px; }
.recommend { font-size: 10px; font-weight: 400; background: #e9f1e9; color: var(--accent); border-radius: 4px; padding: 2px 6px; }
.example-label { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.example-label + .surface { margin-bottom: 26px; }
.surface { padding: 16px; border: 1px solid var(--line); background: #fff; border-radius: 9px; min-width: 0; }
.field-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 9px; }
.count { font-size: 11px; font-weight: 400; color: var(--muted); }
.entry-field { border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 12px; }
.field-icon { width: 76px; height: 112px; display: grid; place-items: center; background: #f7f8f6; color: #69806c; border-radius: 5px; grid-row: 1 / span 2; }
.field-icon span { width: 25px; height: 25px; }
.entry-field .identifier-list { padding: 4px 4px 0 0; }
.identifier-list { display: grid; gap: 6px; min-width: 0; align-content: start; }
.identifier { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 10px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); text-align: left; }
.identifier:hover { border-color: #bfcdbf; }
.identifier .grip { flex: 0 0 10px; color: #99a39b; display: grid; grid-template-columns: repeat(2, 2px); gap: 2px; cursor: grab; }
.grip i { width: 2px; height: 2px; border-radius: 100%; background: currentColor; }
.identifier-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.identifier-title { font-size: 14px; font-weight: 500; line-height: 19px; overflow-wrap: anywhere; }
.identifier-meta { display: flex; flex-wrap: wrap; column-gap: 6px; row-gap: 2px; font-size: 11px; line-height: 16px; color: var(--muted); align-items: center; }
.identifier-meta .separator { color: #a6afa8; }
.identifier-status { display: inline-flex; gap: 4px; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #43a976; flex-shrink: 0; }
.dot.draft { background: #b99645; }
.row-action { flex: 0 0 23px; width: 23px; height: 23px; border: 0; border-radius: 4px; padding: 4px; color: #707c73; background: transparent; display: grid; place-items: center; }
.row-action:hover { color: var(--ink); background: #eef3ed; }
.row-action span { width: 15px; height: 15px; }
.field-actions { grid-column: 2; display: flex; margin: 12px 4px 6px 0; align-self: end; }
.field-actions button { border: 1px solid var(--line); background: white; font-size: 12px; line-height: 20px; padding: 5px 8px; color: var(--ink); }
.field-actions button:first-child { border-radius: 5px 0 0 5px; }
.field-actions button:last-child { border-radius: 0 5px 5px 0; margin-left: -1px; }
.field-actions button:hover:not(:disabled) { background: #f1f5ef; }
.hint { color: var(--muted); font-size: 11px; margin-top: 7px; }
.empty { color: var(--muted); padding-top: 7px; font-size: 13px; }
.picker .field-label { font-size: 15px; font-weight: 500; }
.search { display: flex; gap: 9px; align-items: center; border: 1px solid var(--line); border-radius: 5px; padding: 7px 10px; margin: 14px 0; background: #fff; color: #89968c; }
.search span { width: 15px; height: 15px; }
.search input { border: 0; outline: 0; width: 100%; font: 13px/22px Main, sans-serif; color: var(--ink); background: transparent; }
.search:focus-within { outline: 2px solid #345568; outline-offset: 2px; }
.picker .identifier { width: 100%; cursor: pointer; }
.identifier.selected { border-color: #a9c3ac; background: #f0f6ef; }
.selection { display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid #cbd5cc; border-radius: 4px; background: #fff; flex: 0 0 18px; }
.selection span { width: 12px; height: 12px; }
.selected .selection { color: #fff; background: var(--accent); border-color: var(--accent); }
.cover { display: none; }
.variant-b .identifier-list { gap: 0; border: 1px solid var(--line); border-radius: 6px; overflow: clip; padding: 0; }
.variant-b .entry-field .identifier-list { margin: 4px 4px 0 0; }
.variant-b .identifier { border: 0; border-radius: 0; padding: 11px 9px; }
.variant-b .identifier + .identifier { border-top: 1px solid var(--line); }
.variant-b .identifier.selected { box-shadow: inset 3px 0 #739a78; }
.variant-b .identifier-title { font-weight: 400; }
:is(.variant-c, .variant-d) .entry-field { display: block; padding: 8px; }
:is(.variant-c, .variant-d) .field-icon { display: none; }
:is(.variant-c, .variant-d) .entry-field .identifier-list { padding: 0; }
:is(.variant-c, .variant-d) .field-actions { margin: 12px 0 0; }
:is(.variant-c, .variant-d) .identifier { padding: 8px; gap: 10px; }
:is(.variant-c, .variant-d) .cover { display: grid; place-items: center; width: 42px; height: 46px; flex: 0 0 42px; border-radius: 4px; overflow: hidden; background: #f0f3ee; color: #79917b; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.cover span { width: 20px; height: 20px; }
:is(.variant-c, .variant-d) .identifier-meta { gap: 6px; }
:is(.variant-c, .variant-d) .grip { flex-basis: 6px; }
.variant-d .entry-field { padding: 0; overflow: clip; }
.variant-d .identifier-list { gap: 0; }
.variant-d .identifier { padding: 11px 12px; border: 0; border-radius: 0; }
.variant-d .identifier + .identifier { border-top: 1px solid var(--line); }
.variant-d .field-actions { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); background: #fbfcfa; }
.variant-d .picker .identifier-list { border: 1px solid var(--line); border-radius: 6px; overflow: clip; }
.variant-d .picker .identifier:focus-visible { outline-offset: -3px; }
.variant-d .entry-field .empty { padding: 16px 12px; }
.variant-d .row-action:focus-visible { outline-offset: 1px; }
footer { margin-top: 22px; font-size: 12px; color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
@media (max-width: 1100px) { .comparison { grid-template-columns: minmax(0, 580px); justify-content: center; gap: 32px; } .variant-heading { min-height: 0; padding-bottom: 20px; } }
@media (max-width: 600px) {
  main { padding: 18px 14px; }
  .study-heading { display: block; }
  h1 { font-size: 26px; }
  .study-label { display: none; }
  .study-controls { flex-wrap: wrap; margin-bottom: 24px; }
  .study-controls button { padding-inline: 8px; font-size: 12px; }
  .study-controls .reset { margin-left: 0; }
  .surface { padding: 12px; }
  .entry-field { grid-template-columns: 48px minmax(0, 1fr); gap: 8px; }
  .field-icon { width: 48px; height: 72px; }
  .identifier { padding: 9px 6px; gap: 6px; }
  .identifier-title { font-size: 13px; }
  .identifier .grip { flex-basis: 6px; }
  :is(.variant-c, .variant-d) .cover { width: 36px; flex-basis: 36px; }
  .recommend { font-size: 9px; }
}
</style>
</head>

  { id: 3, title: 'A quieter corner of the coast', type: 'Page', language: 'NO', status: 'Draft' },
]
const variants = [
  { id: 'a', title: 'Compact cards', description: 'A clear boundary around every item. Quiet, compact and easy to reorder.' },
  { id: 'b', title: 'Joined list', description: 'One outline with divided rows. A denser list with less repeated framing.' },
  { id: 'c', title: 'Cover rows', description: 'The entry’s cover leads. A document icon fills in when no cover is set.' },
  { id: 'd', title: 'Joined cover rows', description: 'One shared outline, thin dividers and a cover for each entry. Actions sit in the footer.' },
]
let selected = [1, 2]
const icon = name => `<span class="hero-${name}" aria-hidden="true"></span>`
const grip = '<span class="grip" aria-hidden="true">' + '<i></i>'.repeat(6) + '</span>'
const escape = text => text.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('"', '&quot;')
const entryMarkup = (entry, picker = false) => {
  const active = selected.includes(entry.id)
  const content = `${picker ? '' : grip}<span class="cover">${entry.cover ? `<img src="${entry.cover}" alt="">` : icon('document-text')}</span>
    <span class="identifier-copy"><span class="identifier-title">${escape(entry.title)}</span><span class="identifier-meta">
      <span>${entry.type}</span><span class="separator">·</span><span>${entry.language}</span><span class="separator">·</span>
      <span class="identifier-status"><i class="dot ${entry.status === 'Draft' ? 'draft' : ''}"></i>${entry.status}</span>
    </span></span>`
  return picker
    ? `<button class="identifier ${active ? 'selected' : ''}" aria-pressed="${active}" data-toggle="${entry.id}">${content}<span class="selection">${active ? icon('check') : ''}</span></button>`
    : `<div class="identifier" draggable="true" data-entry="${entry.id}">${content}<button class="row-action" data-remove="${entry.id}" aria-label="Remove ${escape(entry.title)}">${icon('x-mark')}</button></div>`
}
function render() {
  for (const variant of document.querySelectorAll('.variant')) {
    const list = variant.querySelector('.entry-field .identifier-list')
    list.innerHTML = selected.length ? selected.map(id => entryMarkup(entries.find(e => e.id === id))).join('') : '<div class="empty">No selected entries</div>'
    variant.querySelector('.count').textContent = `${selected.length} selected`
    variant.querySelector('[data-clear]').disabled = !selected.length
    const query = variant.querySelector('input').value.toLowerCase()
    const matches = entries.filter(e => e.title.toLowerCase().includes(query))
    variant.querySelector('.picker .identifier-list').innerHTML = matches.map(entry => entryMarkup(entry, true)).join('') || '<div class="empty">No matching entries</div>'
  }
}
document.querySelector('#comparison').innerHTML = variants.map(v => `
  <section class="variant variant-${v.id}" id="variant-${v.id}">
    <header class="variant-heading"><h2><span class="letter">${v.id.toUpperCase()}</span>${v.title}${v.id === 'd' ? '<span class="recommend">New</span>' : ''}</h2><p>${v.description}</p></header>
    <div class="example-label">In a form · selected items</div>
    <div class="surface"><div class="field-label">Related entries <span class="count"></span></div>
      <div class="entry-field"><div class="field-icon">${icon('link')}</div><div class="identifier-list"></div>
        <div class="field-actions"><button data-open>Select entries</button><button data-clear>Clear all</button></div>
      </div><p class="hint">Select up to 3 entries. Drag items to reorder.</p>
    </div>
    <div class="example-label">In a picker · selected and available items</div>
    <div class="surface picker"><div class="field-label">Select entries <span class="count-label">3 available</span></div>
      <label class="search">${icon('magnifying-glass')}<input type="search" placeholder="Filter entries…" aria-label="Filter entries in variant ${v.id.toUpperCase()}"></label>
      <div class="identifier-list"></div>
    </div>
  </section>`).join('')
render()
document.addEventListener('click', event => {
  const button = event.target.closest('button')
  if (!button) return
  if (button.dataset.view) {
    document.querySelector('#comparison').dataset.view = button.dataset.view
    document.querySelectorAll('.variant').forEach(v => { v.hidden = button.dataset.view !== 'all' && v.id !== `variant-${button.dataset.view}` })
    document.querySelectorAll('button[data-view]').forEach(b => b.setAttribute('aria-pressed', b === button))
    return
  }
  if (button.hasAttribute('data-open')) {
    button.closest('.variant').querySelector('input').focus()
    return
  }
  const id = Number(button.dataset.remove || button.dataset.toggle)
  if (button.id === 'reset') selected = [1, 2]
  else if (button.hasAttribute('data-clear')) selected = []
  else if (button.dataset.remove || selected.includes(id)) selected = selected.filter(value => value !== id)
  else if (button.dataset.toggle) selected.push(id)
  render()
  document.querySelector('#status').textContent = `${selected.length} entries selected in the preview.`
})
document.addEventListener('input', event => { if (event.target.matches('input[type=search]')) render() })
let dragged
document.addEventListener('dragstart', event => { dragged = Number(event.target.closest('[data-entry]')?.dataset.entry); event.dataTransfer.effectAllowed = 'move' })
document.addEventListener('dragover', event => { if (event.target.closest('[data-entry]')) event.preventDefault() })
document.addEventListener('drop', event => {
  const target = Number(event.target.closest('[data-entry]')?.dataset.entry)
  if (!target || !dragged || target === dragged) return
  event.preventDefault()
  const from = selected.indexOf(dragged), to = selected.indexOf(target)
  selected.splice(from, 1)
  selected.splice(to, 0, dragged)
  render()
})
const initialView = location.hash.slice(1)
if (variants.some(variant => variant.id === initialView)) document.querySelector(`button[data-view="${initialView}"]`).click()
</script>
